<div class="settings">
  <div class="settings__header">
    <h1 class="settings__title">Settings</h1>
    <p class="settings__subtitle">Customize your preferences and application settings</p>
  </div>

  <div class="settings__grid">
    <!-- Theme Settings Card -->
    <div class="settings-card">
      <div class="settings-card__icon-wrapper">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" class="settings-card__icon">
          <path
            d="M12 3V4M12 20V21M4 12H3M6.31412 6.31412L5.5 5.5M17.6859 6.31412L18.5 5.5M6.31412 17.69L5.5 18.5M17.6859 17.69L18.5 18.5M21 12H20M16 12C16 14.2091 14.2091 16 12 16C9.79086 16 8 14.2091 8 12C8 9.79086 9.79086 8 12 8C14.2091 8 16 9.79086 16 12Z"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>
      <div class="settings-card__content">
        <h2 class="settings-card__title">Theme</h2>
        <p class="settings-card__description">Choose between light, dark or system theme</p>
        <div class="settings-card__control">
          <app-theme-toggle />
        </div>
      </div>
    </div>

    <!-- Language Settings Card -->
    <div class="settings-card">
      <div class="settings-card__icon-wrapper">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" class="settings-card__icon">
          <path
            d="M3 5H15M9 3V5M10.048 14.5C8.79697 12.9157 7.8464 11.1061 7.244 9.167M5.268 9.167H14.232M12.776 9.167C12.3786 10.7006 11.7669 12.1706 10.964 13.534M10.964 13.534C11.5051 14.3157 12.1214 15.0528 12.807 15.738C13.5784 16.5094 14.4406 17.1774 15.377 17.727M10.964 13.534C10.1766 12.5133 9.51436 11.407 8.988 10.238M21 21L17.4 17.4M17 10C17 11.1819 16.5308 12.3522 15.682 13.682C14.8331 15.0119 13.631 16.4637 12.18 18C10.729 16.4637 9.52688 15.0119 8.67804 13.682C7.82919 12.3522 7.36 11.1819 7.36 10C7.36 8.4087 7.99214 6.88258 9.11736 5.75736C10.2426 4.63214 11.7687 4 13.36 4C14.9513 4 16.4774 4.63214 17.6026 5.75736C18.7279 6.88258 19.36 8.4087 19.36 10H17Z"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>
      <div class="settings-card__content">
        <h2 class="settings-card__title">Language</h2>
        <p class="settings-card__description">Select your preferred language</p>
        <div class="settings-card__control">
          <app-language-switcher />
        </div>
      </div>
    </div>
    @if (isAdmin()) {
      <!-- Admin Panel Card -->
      <div class="settings-card">
        <div class="settings-card__icon-wrapper">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" class="settings-card__icon">
            <path
              d="M12 15C13.6569 15 15 13.6569 15 12C15 10.3431 13.6569 9 12 9C10.3431 9 9 10.3431 9 12C9 13.6569 10.3431 15 12 15Z"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M19.4 15C19.1277 15.6171 19.2231 16.3378 19.65 16.86L19.71 16.94C20.0518 17.2814 20.244 17.7448 20.244 18.23C20.244 18.7152 20.0518 19.1786 19.71 19.52C19.3686 19.8618 18.9052 20.054 18.42 20.054C17.9348 20.054 17.4714 19.8618 17.13 19.52L17.05 19.46C16.5278 19.0331 15.8171 18.9377 15.24 19.21C14.6863 19.4645 14.3243 20.0143 14.31 20.62V20.85C14.31 21.868 13.484 22.694 12.466 22.694H12.264C11.246 22.694 10.42 21.868 10.42 20.85V20.68C10.394 20.056 9.999 19.5044 9.42 19.27C8.84285 18.9977 8.13219 19.0931 7.61 19.52L7.53 19.58C7.18863 19.9218 6.72524 20.114 6.24 20.114C5.75476 20.114 5.29137 19.9218 4.95 19.58C4.60825 19.2386 4.41604 18.7752 4.41604 18.29C4.41604 17.8048 4.60825 17.3414 4.95 17L5.01 16.94C5.43688 16.4178 5.53233 15.7071 5.26 15.13C5.00553 14.5763 4.45568 14.2143 3.85 14.2H3.62C2.602 14.2 1.776 13.374 1.776 12.356V12.154C1.776 11.136 2.602 10.31 3.62 10.31H3.79C4.414 10.284 4.9656 9.889 5.2 9.31C5.47233 8.73285 5.37688 8.02219 4.95 7.5L4.89 7.42C4.54825 7.07863 4.35604 6.61524 4.35604 6.13C4.35604 5.64476 4.54825 5.18137 4.89 4.84C5.23137 4.49825 5.69476 4.30604 6.18 4.30604C6.66524 4.30604 7.12863 4.49825 7.47 4.84L7.53 4.9C8.05219 5.32688 8.76285 5.42233 9.34 5.15H9.4C9.95371 4.90447 10.3157 4.35468 10.33 3.75V3.5C10.33 2.482 11.156 1.656 12.174 1.656H12.376C13.394 1.656 14.22 2.482 14.22 3.5V3.67C14.2343 4.27468 14.5963 4.82447 15.15 5.07C15.7272 5.34233 16.4378 5.24688 16.96 4.82L17.04 4.76C17.3814 4.41825 17.8448 4.22604 18.33 4.22604C18.8152 4.22604 19.2786 4.41825 19.62 4.76C19.9618 5.10137 20.154 5.56476 20.154 6.05C20.154 6.53524 19.9618 6.99863 19.62 7.34L19.56 7.42C19.1331 7.94219 19.0377 8.65285 19.31 9.23V9.29C19.5555 9.84371 20.1053 10.2057 20.71 10.22H20.96C21.978 10.22 22.804 11.046 22.804 12.064V12.266C22.804 13.284 21.978 14.11 20.96 14.11H20.79C20.1853 14.1243 19.6355 14.4863 19.39 15.04L19.4 15Z"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </div>
        <div class="settings-card__content">
          <h2 class="settings-card__title">Admin Panel</h2>
          <p class="settings-card__description">Manage who has admin access</p>
          <div class="settings-card__control">
            <button class="settings-card__admin-link" (click)="goToAdminPanel()">Open</button>
          </div>
        </div>
      </div>
    }
  </div>

  <div class="settings__footer">
    <button class="settings__back-btn" (click)="goBack()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <path
          d="M15 18L9 12L15 6"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      Back to Dashboard
    </button>
  </div>
</div>
